<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable | Di Giacomo Romuald</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0B1F3A" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .notfound {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl) 16px;
      background: var(--color-navy);
      color: var(--color-white);
    }
    .notfound-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 900;
      line-height: 1;
      color: var(--color-red);
    }
    .notfound h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      text-transform: uppercase;
      margin: var(--space-sm) 0;
    }
    .notfound p { color: rgba(255,255,255,.7); max-width: 460px; margin: 0 auto var(--space-lg); }
    .notfound-links { display: flex; gap: var(--space-sm); justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <div class="notfound-code" aria-hidden="true">404</div>
      <h1>Page introuvable</h1>
      <p>La page que vous cherchez n'existe pas ou a été déplacée. Retrouvez nos prestations de peinture ou demandez votre devis gratuit.</p>
      <div class="notfound-links">
        <a href="/" class="btn btn-primary">Retour à l'accueil</a>
        <a href="/services.html" class="btn btn-outline">Nos services</a>
        <a href="/contact.html" class="btn btn-outline">Devis gratuit</a>
      </div>
    </div>
  </main>
</body>
</html>
